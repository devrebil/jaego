    <span style="color:#ccc;font-size:11px">PDF 저장: 인쇄 창에서 대상을 "PDF로 저장"으로 선택</span>
    <button class="tb-btn btn-danger" onclick="closeStmt()">✕ 닫기</button></div>${sheets}`;
  el('stmt-overlay').className='theme-'+(STMT_SET.print_theme||'reference');
  el('stmt-overlay').classList.toggle('mono',(STMT_SET.print_color||'color')==='mono');
  el('stmt-overlay').classList.remove('hide');

function stmtPrint(mode){
  const b=document.body;
  b.classList.add('stmt-printing');
  if(mode==='supply')b.classList.add('stmt-only-supply');
  if(mode==='recv')b.classList.add('stmt-only-recv');
  const done=()=>{b.classList.remove('stmt-printing','stmt-only-supply','stmt-only-recv');window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  window.print();
  setTimeout(done,2000);
}

function vchShowItems(inp,which){

  const rows=VCH_ITEMS.filter(x=>!q||String(x.sku||'').toLowerCase().includes(q)||String(x.name||'').toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=rows.length?rows.map(x=>`<div class="vch-item-option" onmousedown="event.preventDefault();vchPickItem(this,${x.id})"><b>${esc(which==='sku'?(x.sku||x.name):(x.name||x.sku))}</b><small>${esc(x.sku||'')} · ${esc(x.name||'')}${x.spec?' · '+esc(x.spec):''}</small></div>`).join(''):'<div class="vch-item-option" style="color:var(--muted)">검색 결과 없음</div>';

  box.classList.add('show');
}

function vchMobileAddItem(id){
  const it=VCH_ITEMS.find(x=>x.id===id);if(!it)return;
  let tr=[...(el('vch-rows')?.rows||[])].find(r=>r.querySelector('.vi-sku').value===String(it.sku||''));

    if(!tr){vchAddRow();tr=el('vch-rows').rows[el('vch-rows').rows.length-1];}

  }

function vchRenumber(){[...el('vch-rows').rows].forEach((tr,i)=>tr.cells[0].textContent=i+1);}
function vchRowChanged(inp,which){
  const tr=inp.closest('tr');
  if(which==='sku'||which==='name'){
    const v=inp.value.trim();
    const it=which==='sku'?VCH_ITEMS.find(i=>i.sku===v):VCH_ITEMS.find(i=>i.name===v);
    if(it){
      tr.querySelector('.vi-sku').value=it.sku||'';
      tr.querySelector('.vi-name').value=it.name||'';
      tr.querySelector('.vi-spec').value=it.spec||'';
      tr.querySelector('.vi-unit').value=it.unit||'';
      tr.querySelector('.vi-price').value=(VCH_KIND==='purchase'?it.buy_price:it.sell_price)||0;
      if(!tr.querySelector('.vi-qty').value)tr.querySelector('.vi-qty').value=1;
    }
  }
  const rows=el('vch-rows').rows,last=rows[rows.length-1];
  if(last&&(last.querySelector('.vi-sku').value||last.querySelector('.vi-name').value||last.querySelector('.vi-qty').value))vchAddRow();
  vchRecalc();

function vchCalcRow(mode,qty,price){
  const amt=(+qty||0)*(+price||0);
  if(mode==='incl'){const total=Math.round(amt),sup=Math.round(total/1.1);return[sup,total-sup];}
  if(mode==='excl')return[Math.round(amt),Math.round(amt*0.1)];
  return[Math.round(amt),0];
}
function vchRecalc(){
  const mode=el('v-vat')?.value||'none';let tq=0,ts=0,tt=0;
  [...el('vch-rows').rows].forEach(tr=>{
    const q=+tr.querySelector('.vi-qty').value||0,p=+tr.querySelector('.vi-price').value||0;
    const[s,t]=vchCalcRow(mode,q,p);
    tr.querySelector('.vi-sup').textContent=s?won(s):'';
    tr.querySelector('.vi-tax').textContent=t?won(t):'';
    tq+=q;ts+=s;tt+=t;
  });
  vchRenumber();
  if(el('v-t-qty')){el('v-t-qty').textContent=won(tq);el('v-t-sup').textContent=won(ts);el('v-t-tax').textContent=won(tt);el('v-t-total').textContent='합계 '+won(ts+tt)+'원';}

    qty:+tr.querySelector('.vi-qty').value||0,price:+tr.querySelector('.vi-price').value||0,

function koreanMoney(n){
  n=Math.round(Math.abs(+n||0));if(!n)return'영원';
  const d=['','일','이','삼','사','오','육','칠','팔','구'],small=['','십','백','천'],big=['','만','억','조'];
  let s='',gi=0;
  while(n>0){
    let g=n%10000;n=Math.floor(n/10000);
    if(g){let gs='';for(let i=0;i<4;i++){const dg=g%10;g=Math.floor(g/10);if(dg)gs=d[dg]+small[i]+gs;}s=gs+big[gi]+s;}
    gi++;
  }
  return s+'원';
}

async function scanBarcodePhoto(input){
  const file=input.files?.[0];input.value='';if(!file)return;
  el('stock-message').textContent='사진에서 바코드를 찾는 중...';
  try{
    let value='';
    if('BarcodeDetector' in window){
      const bitmap=await createImageBitmap(file),detector=new BarcodeDetector(),codes=await detector.detect(bitmap);
      if(codes.length){ // 바코드가 여러 개 찍히면 사진 중앙에 가장 가까운 것만 인식
        const cx=bitmap.width/2,cy=bitmap.height/2,dist=c=>{const b=c.boundingBox;return Math.hypot(b.x+b.width/2-cx,b.y+b.height/2-cy);};
        value=codes.sort((a,b)=>dist(a)-dist(b))[0].rawValue;
      }
      bitmap.close?.();
    }
    if(!value&&window.ZXingBrowser?.BrowserMultiFormatReader){
      const reader=new ZXingBrowser.BrowserMultiFormatReader();
      try{const roi=await bcCropFileCanvas(file,.8,.55);value=reader.decodeFromCanvas(roi)?.getText?.()||'';}catch(e){} // 중앙 영역 우선 판독
      if(!value){
        const url=URL.createObjectURL(file);
        try{const result=await reader.decodeFromImageUrl(url);value=result?.getText?.()||result?.text||String(result||'');}
        catch(e){}
        finally{URL.revokeObjectURL(url);}
      }
    }
    if(!value)throw new Error('사진에서 바코드를 찾지 못했습니다. 바코드가 화면 중앙에 크게 나오도록 다시 촬영하세요.');
    el('stock-sku').value=value.trim();lookupStockSku(true);
  }
  catch(err){el('stock-message').innerHTML=`<span style="color:var(--danger)">${esc(err.message||'바코드 판독 실패')}</span>`;}
}
async function bcCropFileCanvas(file,ratioW,ratioH){
  const bitmap=await createImageBitmap(file);
  const sw=Math.round(bitmap.width*ratioW),sh=Math.round(bitmap.height*ratioH);
  const c=document.createElement('canvas');c.width=sw;c.height=sh;
  c.getContext('2d').drawImage(bitmap,(bitmap.width-sw)/2,(bitmap.height-sh)/2,sw,sh,0,0,sw,sh);
  bitmap.close?.();return c;
}

let BC_STREAM=null,BC_TIMER=null,BC_BUSY=false,BC_LAST_CODE='',BC_LAST_SEEN=0,BC_LAST_ACCEPT=0,BC_DETECTOR=null,BC_READER=null,BC_TORCH=false;

    <div class="bc-msg" id="bc-msg"></div>
    <div class="bc-controls"><button class="tb-btn btn-gray hide" id="bc-torch" onclick="bcToggleTorch()">🔦 조명</button><button class="tb-btn btn-danger" onclick="closeBarcodeScanner()">✕ 닫기</button></div>
  </div>`);
  try{BC_STREAM=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});}
  catch(e){

    el('bc-photo-input')?.click();return;
  }
  const video=el('bc-video');
  if(!video){BC_STREAM.getTracks().forEach(t=>t.stop());BC_STREAM=null;return;} // 스트림 대기 중 닫힌 경우
  video.srcObject=BC_STREAM;try{await video.play();}catch(e){}
  if(BC_STREAM.getVideoTracks()[0]?.getCapabilities?.().torch)el('bc-torch')?.classList.remove('hide');
  BC_LAST_CODE='';BC_LAST_SEEN=0;BC_LAST_ACCEPT=0;BC_TORCH=false;BC_BUSY=false;

function closeBarcodeScanner(){
  clearInterval(BC_TIMER);BC_TIMER=null;
  BC_STREAM?.getTracks().forEach(t=>t.stop());BC_STREAM=null;
  el('bc-scanner')?.remove();
  focusStockSku();
}
function bcRoiCanvas(video,box){ // 화면의 스캔 박스 좌표를 object-fit:cover 기준 원본 영상 좌표로 변환해 잘라냄
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return null;
  const er=video.getBoundingClientRect(),br=box.getBoundingClientRect();
  const scale=Math.max(er.width/vw,er.height/vh);
  const sx=Math.max(0,(br.left-er.left+(vw*scale-er.width)/2)/scale),sy=Math.max(0,(br.top-er.top+(vh*scale-er.height)/2)/scale);
  const sw=Math.min(vw-sx,br.width/scale),sh=Math.min(vh-sy,br.height/scale);
  if(sw<20||sh<20)return null;
  const c=document.createElement('canvas');c.width=Math.round(sw);c.height=Math.round(sh);
  c.getContext('2d').drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
  return c;
}
async function bcTick(){
  if(BC_BUSY)return;
  const video=el('bc-video'),box=el('bc-box');
  if(!video||!box||video.readyState<2)return;
  BC_BUSY=true;
  try{
    const roi=bcRoiCanvas(video,box);if(!roi)return;
    let code='';
    if('BarcodeDetector' in window){
      BC_DETECTOR=BC_DETECTOR||new BarcodeDetector();
      const codes=await BC_DETECTOR.detect(roi);if(codes.length)code=codes[0].rawValue;
    }else if(window.ZXingBrowser?.BrowserMultiFormatReader){
      BC_READER=BC_READER||new ZXingBrowser.BrowserMultiFormatReader();
      try{code=BC_READER.decodeFromCanvas(roi)?.getText?.()||'';}catch(e){}
    }
    if(code)bcHandleCode(String(code).trim());
  }catch(e){}
  finally{BC_BUSY=false;}
}
function bcHandleCode(code){
  if(!code)return;
  const now=Date.now();
  if(code===BC_LAST_CODE){
    const away=now-BC_LAST_SEEN;BC_LAST_SEEN=now;
    if(away<900)return; // 같은 바코드를 계속 비추는 동안은 무시, 0.9초 이상 화면에서 뗐다가 다시 대면 재인식
  }else{
    if(now-BC_LAST_ACCEPT<500)return; // 서로 다른 코드 연속 인식 시 최소 간격
    BC_LAST_SEEN=now;
  }
  BC_LAST_CODE=code;BC_LAST_ACCEPT=now;
  navigator.vibrate?.(60);
  const box=el('bc-box');box?.classList.add('bc-hit');setTimeout(()=>box?.classList.remove('bc-hit'),450);
  const item=STOCK_ITEMS.find(x=>String(x.sku).toLowerCase()===code.toLowerCase()),msg=el('bc-msg');
  if(item){
    addStockCartItem(item);
    const total=STOCK_CART.reduce((n,x)=>n+Number(x.qty||0),0);
    if(msg)msg.innerHTML=`<span class="bc-ok">✅ ${esc(item.name)} 추가됨 · 총 ${won(total)}개</span>`;
  }else{
    const inp=el('stock-sku');if(inp){inp.value=code;lookupStockSku(true);}
    if(msg)msg.innerHTML=`<span class="bc-bad">⚠️ 등록되지 않은 품목코드: ${esc(code)}</span><div style="font-size:11px;color:#ddd;margin-top:4px">닫기를 누르면 신규 품목으로 등록할 수 있습니다</div>`;
  }
}

async function loadReport(mode=REPORT_MODE){

       <div><div class="line-chart-wrap">${lineChart}</div>
       <div style="font-size:11px;color:var(--muted);margin-top:6px;"><span style="color:var(--primary)">━━</span> 매출 &nbsp;<span style="color:var(--orange)">━━</span> 매입</div></div>
       <div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--primary) 0 ${sellPct}%,var(--orange) ${sellPct}% 100%)"></div><div class="donut-legend"><b>매출 ${sellPct}%</b><br>매입 ${buyPct}%</div></div>
       </div></div>`;
  el('rp-body').innerHTML=

function compactMoney(v){v=Number(v)||0;if(v>=100000000)return(v/100000000).toFixed(v%100000000?1:0)+'억';if(v>=10000)return(v/10000).toFixed(v%10000?1:0)+'만';return won(v);}
function buildReportLineChart(series){
  const points=series.map(s=>({label:(s.label||'').replace('-','.'),buy:+s.buy||0,sell:+s.sell||0}));
  // 모바일: 화면 폭에 모든 점을 압축해서 가로 스크롤 없이 표시, 데스크톱: 점당 90px 확보
  const m=isMobile();
  const W=m?Math.max(280,Math.min(innerWidth,720)-74):Math.max(900,points.length*90);
  const H=m?240:330,L=m?46:88,R=m?12:28,T=m?20:45,B=m?36:58,plotW=W-L-R,plotH=H-T-B;
  const rawMax=Math.max(1,...points.flatMap(p=>[p.buy,p.sell]));
  const pow=Math.pow(10,Math.floor(Math.log10(rawMax))),step=Math.max(pow,Math.ceil(rawMax/(pow*5))*pow),max=step*5;
  const x=i=>L+(points.length===1?plotW/2:i*plotW/(points.length-1));
  const y=v=>T+plotH-(v/max*plotH);
  let grid='',labels='';
  for(let i=0;i<=5;i++){const yy=T+i*plotH/5,val=max*(5-i)/5;grid+=`<line class="line-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"></line>`;labels+=`<text class="chart-axis-label" x="${L-8}" y="${yy+4}" text-anchor="end">${compactMoney(val)}</text>`;}
  const every=m?(points.length>5?Math.ceil(points.length/5):1):(points.length>18?2:1);
  const labelY=m?H-B+18:H-25;
  points.forEach((p,i)=>{if(i%every===0||(!m&&i===points.length-1))labels+=`<text class="chart-month-label" x="${x(i)}" y="${labelY}" text-anchor="middle">${m?p.label.slice(2):p.label}</text>`;});
  const sellPts=points.map((p,i)=>`${x(i)},${y(p.sell)}`).join(' '),buyPts=points.map((p,i)=>`${x(i)},${y(p.buy)}`).join(' ');
  const r=m?3:4;
  const dots=points.map((p,i)=>`<circle class="line-dot-sell" cx="${x(i)}" cy="${y(p.sell)}" r="${r}"><title>${p.label} 매출 ${won(p.sell)}원</title></circle>${p.sell&&!m?`<text x="${x(i)}" y="${Math.max(14,y(p.sell)-11)}" text-anchor="middle" style="font-size:11px;fill:var(--primary);font-weight:700">${compactMoney(p.sell)}</text>`:''}<circle class="line-dot-buy" cx="${x(i)}" cy="${y(p.buy)}" r="${r}"><title>${p.label} 매입 ${won(p.buy)}원</title></circle>${p.buy&&!m?`<text x="${x(i)}" y="${Math.min(H-B-5,y(p.buy)+18)}" text-anchor="middle" style="font-size:11px;fill:#c97900;font-weight:700">${compactMoney(p.buy)}</text>`:''}`).join('');
  const axisTitles=m?'':`<text class="chart-axis-label" x="17" y="${T+plotH/2}" text-anchor="middle" transform="rotate(-90 17 ${T+plotH/2})">금액 (원)</text>
    <text class="chart-axis-label" x="${L+plotW/2}" y="${H-4}" text-anchor="middle">연월</text>`;
  return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" style="width:${W}px">
    ${grid}<line class="line-axis" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"></line><line class="line-axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"></line>
    ${labels}${axisTitles}
    <polyline class="line-sell" points="${sellPts}"></polyline><polyline class="line-buy" points="${buyPts}"></polyline>${dots}
  </svg>`;
}
function downloadReport(mode=REPORT_MODE){
  if(mode==='month'){
    const value=el('rp-month')?.value||'';if(!/^\d{4}-\d{2}$/.test(value))return;
    const [year,month]=value.split('-').map(Number);location.href=`/api/export/month?year=${year}&month=${month}`;return;
  }
  const year=Number(el('rp-year')?.value);if(!Number.isInteger(year)||year<2000||year>2100)return;
  location.href=`/api/export/year?year=${year}`;
}

async function delInoutTx(id){

      <input class="tbl-mgmt-input" id="tl-${k}" value="${esc(label)}" placeholder="${esc(def)}">

async function saveMultiSearchSettings(){
  const rows=[...(el('search-link-settings')?.querySelectorAll('.search-link-row')||[])],links=[];
  for(const row of rows){
    const name=(row.querySelector('.search-link-name')?.value||'').trim();let url=(row.querySelector('.search-link-url')?.value||'').trim();
    if(!name&&!url)continue;if(!name||!url){alert('바로가기의 버튼 이름과 사이트 주소를 모두 입력하세요.');return;}
    if(!/^https?:\/\//i.test(url))url='https://'+url;
    try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw new Error();url=parsed.href;}catch(_){alert(`${name} 사이트 주소를 확인하세요.`);return;}
    links.push({name,url});
  }
  if(links.length>5){alert('바로가기는 최대 5개까지 저장할 수 있습니다.');return;}
  USER_PREFS.search_default_mode=el('set-search-default')?.value==='all'?'all':'general';USER_PREFS.search_links=links;
  const r=await saveUserPreferences(),status=el('search-settings-status');

  if(status){status.textContent='멀티검색 설정이 저장되었습니다.';status.style.color='var(--success)';}

}

function previewPrintAsset(input,type){

    const [logo,watermark,stamp]=await Promise.all([readPrintAssetFile('set-logo',SETTINGS_DATA.company_logo),readPrintAssetFile('set-watermark',SETTINGS_DATA.company_watermark),readPrintAssetFile('set-stamp',SETTINGS_DATA.company_stamp)]);
    const s={...SETTINGS_DATA,company_logo:logo,company_watermark:watermark,company_stamp:stamp,print_color:el('set-print-color').value,print_theme:el('set-print-theme').value,company_watermark_size:el('set-watermark-size').value,company_stamp_position:el('set-stamp-position').value,company_homepage:el('set-homepage').value,company_bank:el('set-bank').value,print_footer_order:el('set-footer-order').value};
    const v={date:todayStr(),seq:1,contact:'미리보기 거래처',vat_mode:'excl',memo:'출력 디자인 미리보기',total:33000,items:[{sku:'A-100',name:'샘플 품목',spec:'기본 규격',qty:2,price:15000,supply:30000,tax:3000,note:''}]};
    const c={address:'거래처 주소 미리보기',phone:'02-0000-0000'};
    el('stmt-overlay').innerHTML=`<div class="stmt-toolbar"><span style="color:#fff;font-weight:700">👁 저장 전 출력 미리보기</span><span style="color:#ccc;font-size:11px">현재 선택한 이미지와 설정을 반영했습니다.</span><button class="tb-btn btn-danger" onclick="closeStmt()">✕ 닫기</button></div><div class="stmt-sheet">${vchStmtDoc(v,s,c)}</div>`;
    el('stmt-overlay').className='theme-'+(s.print_theme||'reference');el('stmt-overlay').classList.toggle('mono',s.print_color==='mono');el('stmt-overlay').classList.remove('hide');
  }catch(_){printAssetStatus('출력 미리보기를 만들지 못했습니다.',false);}
}
async function savePrintSettings(){
  const logo=el('set-logo')?.files[0],watermark=el('set-watermark')?.files[0],stamp=el('set-stamp')?.files[0],hasImages=!!(logo||watermark||stamp);
  const body={print_color:el('set-print-color').value,print_theme:el('set-print-theme').value,company_watermark_size:el('set-watermark-size').value,company_stamp_position:el('set-stamp-position').value,company_homepage:el('set-homepage').value,company_bank:el('set-bank').value,print_footer_order:el('set-footer-order').value};
  const button=el('print-settings-save');if(button){button.disabled=true;button.textContent='저장 중…';}
  try{
    if(hasImages){
      printAssetStatus('로고·워터마크·도장 이미지를 업로드하고 있습니다.');
      const fd=new FormData();if(logo)fd.append('logo',logo);if(watermark)fd.append('watermark',watermark);if(stamp)fd.append('stamp',stamp);
      const upload=await postForm('/api/settings/print-assets',fd,false);
      if(!upload.ok){printAssetStatus(upload.error||'이미지를 저장하지 못했습니다.',false);return;}
    }
    printAssetStatus('출력 설정을 저장하고 있습니다.');
    const r=await post('/api/settings/save',body,false);
    if(!r.ok){printAssetStatus(r.error||'출력 설정을 저장하지 못했습니다.',false);return;}
    SETTINGS_CAT='print';await RENDER.settings();printAssetStatus(hasImages?'출력 설정과 이미지가 함께 저장되었습니다.':'출력 설정이 저장되었습니다.');
  }catch(error){printAssetStatus('출력 설정 저장 중 오류가 발생했습니다.',false);}
  finally{const current=el('print-settings-save');if(current){current.disabled=false;current.textContent='출력 설정 저장';}}
}
async function saveAccount(){
  const r=await post('/api/account/update',{username:el('ac-user').value,password:el('ac-pw').value||null,name:el('ac-name').value,
    email:el('ac-email').value,security_question:el('ac-question').value,security_answer:el('ac-answer').value});
  if(!r.ok){alert(r.error||'저장하지 못했습니다.');return;}
  ME=await api('/api/me');startApp();switchTab('settings');alert('저장됨');
}
function filterMemberRows(value){const q=(value||'').trim().toLowerCase();document.querySelectorAll('#member-management-body tr').forEach(row=>row.classList.toggle('hide',q&&!row.dataset.memberSearch.includes(q)));}
async function setRole(username,role){const r=await post('/api/users/role',{username,role},false);if(!r.ok)alert(r.error||'권한을 변경하지 못했습니다.');}
async function restoreDb(domain,inp){
  if(!inp.files[0])return;if(!confirm(domain+' DB를 복원하면 현재 데이터가 교체됩니다. 진행할까요?'))return;
  const fd=new FormData();fd.append('file',inp.files[0]);
  const r=await postForm('/api/restore/'+domain,fd);
  alert(r.ok?'복원 완료':'실패: '+r.error);RENDER.settings();
}
async function resetBusinessData(){
  const confirmText=prompt('모든 업무 데이터를 삭제합니다.\n회원 계정과 회사·사업자·출력·사용자 설정은 유지됩니다.\n\n계속하려면 RESET_ALL_DATA 를 입력하세요.');
  if(confirmText!=='RESET_ALL_DATA')return;
  if(!confirm('거래처, 품목, 입출고, 전표, 일정, 프로젝트, 메모 등 모든 업무 데이터를 삭제할까요?\n실행 전 자동 백업됩니다.'))return;
  const button=el('business-reset-btn');
  if(button){button.disabled=true;button.textContent='초기화 중...';}
  try{
    const r=await post('/api/business-data/reset',{confirm:confirmText},false);
    if(!r.ok){alert(r.error||'초기화하지 못했습니다.');return;}
    const uploadText=r.deleted_uploads?`\n업무 첨부파일 ${r.deleted_uploads}개도 삭제했습니다.`:'';
    alert(`업무 데이터 ${r.total}건을 삭제했습니다.${uploadText}\n백업: ${r.backup_dir}`);
    await RENDER.settings();
  }finally{
    if(button&&document.body.contains(button)){button.disabled=false;button.textContent='완전 초기화';}
  }
}
async function loadAudit(){
  const d=el('au-domain')?.value||'',u=el('au-user')?.value||'',s=el('au-start')?.value||'',e=el('au-end')?.value||'';
  const r=await api(`/api/audit?domain=${d}&user=${encodeURIComponent(u)}&start=${s}&end=${e}`);
  const actionLabel={login:'🔑 로그인',logout:'🔓 로그아웃',page_load:'🔄 새로고침/접속',page_close:'🚪 창 닫기',insert:'추가',update:'수정',delete:'삭제'};
  el('audit-body').innerHTML=r.length?r.map(a=>`<tr><td style="white-space:nowrap">${esc(a.ts)}</td><td>${esc(a.user)}</td><td style="white-space:nowrap;font-size:11px;color:var(--muted)">${esc(a.ip||'')}</td><td><span class="tag">${esc(a.domain)}</span></td><td>${actionLabel[a.action]||esc(a.action)}</td><td>${esc(a.target_id||'')}</td><td>${esc(a.detail||'')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">로그 없음</td></tr>';
}

// ── 클라이언트 이벤트 로깅 ──
function sendClientEvent(action,detail){
  if(!ME?.user)return;
  try{navigator.sendBeacon('/api/audit/client-event',new Blob([JSON.stringify({action,detail})],{type:'application/json'}));}catch(e){}
}
window.addEventListener('beforeunload',()=>{
  if(ME?.user)sendClientEvent('page_close','창 닫기 또는 새로고침');
});

init();
</script>
