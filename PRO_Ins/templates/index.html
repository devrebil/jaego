<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>재고 관리 프로그램</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4a90e2;--danger:#ff4757;--secondary:#5352ed;--success:#2ed573;
  --orange:#ffa502;--purple:#a55eea;--bg:#f0f2f5;--white:#fff;--border:#e8ecf0;
  --text:#2f3542;--muted:#8395a7;--sb-w:190px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* 로그인 */
#login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#4a90e2,#5352ed);display:flex;align-items:center;justify-content:center;z-index:10000;}
.login-box{background:#fff;border-radius:16px;padding:34px 30px;width:340px;max-height:94vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.25);}
.login-box h2{font-size:20px;margin-bottom:18px;text-align:center;}
.login-box input,.login-box select{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
.login-box button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.login-box .link{text-align:center;margin-top:12px;font-size:12px;color:var(--primary);cursor:pointer;}
.login-links{display:flex;justify-content:center;gap:12px;margin-top:12px;}
.login-links .link{margin:0;}
.login-box select{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;}
.recovery-result{min-height:18px;margin:8px 0;font-size:12px;text-align:center;color:var(--primary);font-weight:700;}
.login-err{color:var(--danger);font-size:12px;margin-bottom:8px;min-height:16px;text-align:center;}

/* 사이드바 */
.sb{width:var(--sb-w);background:#1e272e;color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden;}
.sb.collapsed{width:0;}
.sb-logo{padding:13px 12px 8px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo-title{font-size:14px;font-weight:700;}
.sb-logo-sub{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px;}
.sb-user{margin:6px 7px;padding:7px 9px;background:rgba(255,255,255,.06);border-radius:8px;display:flex;align-items:center;gap:7px;}
.sb-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.sb-username{font-size:12px;font-weight:600;}
.sb-nav{overflow-y:auto;flex:1;}
.nav-item{display:flex;align-items:center;gap:7px;padding:8px 12px;cursor:pointer;border-left:3px solid transparent;font-size:12px;color:rgba(255,255,255,.6);transition:all .15s;white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(74,144,226,.15);color:#fff;border-left-color:var(--primary);font-weight:600;}
.nav-item .ic{font-size:14px;width:17px;text-align:center;}
.nav-shortcut{margin-left:2px;font-size:9px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.1px;}
.nav-item.active .nav-shortcut,.nav-item:hover .nav-shortcut{color:rgba(255,255,255,.82);}
.submenu{background:rgba(0,0,0,.25);overflow:hidden;max-height:0;transition:none;}
.submenu.open{max-height:320px;}
.submenu .nav-item{padding-left:30px;font-size:11.5px;}
.sb-bottom{padding:8px;border-top:1px solid rgba(255,255,255,.08);}
.mention-alert{margin:7px 8px;padding:8px 9px;border-radius:8px;background:rgba(74,144,226,.18);border:1px solid rgba(74,144,226,.45);font-size:11px;color:#fff;display:none;cursor:pointer;}
.mention-alert.show{display:flex;align-items:center;gap:6px;}
.mention-alert .text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mention-alert .dismiss{border:0;background:transparent;color:#b9d8ff;font-weight:800;cursor:pointer;padding:2px 4px;}
.logout-btn{width:100%;padding:8px;background:rgba(255,71,87,.15);color:#ff6b81;border:1px solid rgba(255,71,87,.3);border-radius:6px;cursor:pointer;font-size:12px;}
.mini-cal{padding:8px;font-size:10px;color:#cfd6dd;}
.mini-cal table{width:100%;border-collapse:collapse;}
.mini-cal td{text-align:center;padding:2px 0;cursor:pointer;border-radius:4px;}
.mini-cal td.today{background:var(--primary);color:#fff;font-weight:700;}
.mini-cal th{color:rgba(255,255,255,.4);font-weight:500;padding-bottom:3px;}
.mini-cal .mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:700;color:#fff;}
.mini-cal .mc-head button{background:none;border:none;color:#9aa;cursor:pointer;font-size:13px;}
.mini-cal th.sat,.mini-cal td.sat{color:#60a5fa;font-weight:700;}
.mini-cal th.sun,.mini-cal td.sun,.mini-cal td.holiday{color:#ff6b81;font-weight:700;}

/* 메인 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.topbar-spacer{flex:1;}
.topbar-date{font-size:18px;font-weight:700;}
.topbar-mobile-url{margin-left:12px;font-size:12px;font-weight:600;color:var(--muted);background:#f1f5f9;border:1px solid var(--border);border-radius:14px;padding:4px 10px;cursor:pointer;vertical-align:2px;white-space:nowrap}
.topbar-mobile-url:hover{color:var(--primary);border-color:var(--primary)}
.tb-btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:#27ae60;color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-gray{background:#f1f2f6;color:var(--text);}
.btn-sm{padding:4px 9px;font-size:12px;}

.content{flex:1;overflow:auto;padding:16px;display:none;}
.content.active{display:block;}

.panel{background:var(--white);border-radius:10px;border:1px solid var(--border);box-shadow:0 1px 5px rgba(0,0,0,.04);}
.ph{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
.ph .right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.pb{padding:12px 14px;}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px;}
h2.page-title{font-size:18px;margin-bottom:14px;}

/* 홈 그리드 (3열 x 2행 = 6칸) */
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:13px;height:calc(100vh - 84px);}
.home-grid>.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.home-grid .pbody{flex:1;overflow:auto;min-height:0;}
.home-calendar-panel #home-cal{flex:1;min-height:0;overflow:auto;padding-bottom:6px!important;}
#home-cal .cal-cell{border-color:transparent;background:transparent;box-shadow:none;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;}
#home-cal .cal-cell:hover:not(.focus-day){background:#f6f8fb;}
#home-cal .cal-cell.focus-day{border-color:#7db1ff;background:linear-gradient(145deg,#f9fcff,#e6f1ff);box-shadow:0 5px 12px rgba(37,99,235,.22),inset 0 1px 0 rgba(255,255,255,.95);transform:translateY(-1px);border-radius:12px;}
#home-cal .cal-cell.focus-day .d{color:var(--primary);font-size:17px;font-weight:800;}
#home-cal .cal-cell.focus-day.sun .d,#home-cal .cal-cell.focus-day.holiday .d{color:var(--danger);}
#home-cal .cal-cell.focus-day.sat .d{color:#2563eb;}
.home-sales-stack{display:flex;flex-direction:column;gap:9px;height:100%;}
.home-sales-card{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;text-align:center;padding:8px;}
.home-sales-card .label{font-size:11px;color:var(--muted);}
.home-sales-card .amount{font-size:22px;font-weight:800;margin-top:3px;}
.cal-cnt{font-size:9px;color:var(--primary);font-weight:700;line-height:1;margin-top:1px;}
.cal-cell.sel .cal-cnt{color:#fff;}
/* 홈 캘린더 일정 필터 버튼 */
.cal-filter{display:flex;gap:3px;padding:7px 10px;border-top:1px solid var(--border);flex-shrink:0;}
.filter-btn{flex:1;padding:4px 3px;font-size:10px;font-weight:600;border:1px solid var(--border);border-radius:5px;background:var(--white);cursor:pointer;font-family:inherit;}
.filter-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}
/* 필터링 접기/펼치기 */
.filter-collapse-btn{padding:4px 9px;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:5px;background:var(--white);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s;}
.filter-collapse-btn.open{background:var(--primary);color:#fff;border-color:var(--primary);}
.filter-panel{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px 6px;background:var(--white);border:1px solid var(--border);border-radius:0 0 8px 8px;border-top:none;}
.filter-panel.hide{display:none;}
/* 테이블 관리 설정 */
.tbl-mgmt-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tbl-mgmt-tab{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:600;}
.tbl-mgmt-tab.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.tbl-mgmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:600px){.tbl-mgmt-grid{grid-template-columns:1fr;}}
.tbl-mgmt-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);}
.tbl-mgmt-label{font-size:11px;color:var(--muted);width:70px;flex-shrink:0;}
.tbl-mgmt-input{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;}
.tbl-mgmt-toggle{width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.tbl-mgmt-toggle.on{background:var(--primary);}
.tbl-mgmt-toggle.off{background:#ccc;}
.filter-btn.on-gray{background:#636e72;color:#fff;border-color:#636e72;}

/* 거래명세표 */
#stmt-overlay{position:fixed;inset:0;z-index:9000;background:#525659;overflow:auto;padding:20px 10px 60px;}
#stmt-overlay.hide{display:none;}
.stmt-toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;background:#333;padding:10px;border-radius:8px;max-width:820px;margin:0 auto 14px;}
.stmt-toolbar .tb-btn{font-size:13px;}
.stmt-sheet{width:210mm;min-height:296mm;background:#fff;margin:0 auto 16px;padding:10mm 8mm;box-shadow:0 2px 12px rgba(0,0,0,.5);box-sizing:border-box;display:flex;flex-direction:column;gap:8mm;color:#000;}
.stmt-copy{flex:1;display:flex;flex-direction:column;}
.stmt-copy table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;color:#000;}
.stmt-copy td,.stmt-copy th{border:1px solid var(--stc);padding:2px 4px;height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#fff;color:#000;font-weight:400;}
.stmt-copy .stc{color:var(--stc);}
.stmt-copy.supply{--stc:#e03131;--stfill:#fff0f0;}
.stmt-copy.recv{--stc:#1a73b8;--stfill:#eaf6fd;}
.stmt-title{font-size:22px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--stc);}
.stmt-title small{font-size:11px;letter-spacing:0;font-weight:600;}
.stmt-copy .num{text-align:right;}
.stmt-copy .ctr{text-align:center;}
.stmt-copy .lbl{background:#fff;color:var(--stc);text-align:center;font-weight:600;font-size:10px;}
.stmt-vert{width:22px!important;min-width:22px;padding:2px 0!important;text-align:center!important;vertical-align:middle!important;font-size:10px;line-height:22px!important;white-space:normal!important;color:var(--stc);writing-mode:vertical-rl;text-orientation:upright;overflow:visible!important;text-overflow:clip!important;letter-spacing:2px;}
@media print{
  body.stmt-printing>*:not(#stmt-overlay){display:none!important;}
  body.stmt-printing #stmt-overlay{position:static;background:#fff;padding:0;overflow:visible;}
  body.stmt-printing .stmt-toolbar{display:none!important;}
  body.stmt-printing .stmt-sheet{box-shadow:none;margin:0;width:auto;min-height:auto;page-break-after:always;}
  body.stmt-printing.stmt-only-supply .stmt-copy.recv{display:none!important;}
  body.stmt-printing.stmt-only-recv .stmt-copy.supply{display:none!important;}
}
/* 인쇄 색상 모드: 칼라(기본) / 흑백 */
#stmt-overlay .stmt-sheet{--dc:#1a4f9c;}
#stmt-overlay.theme-reference .stmt-copy.supply{--stc:#d95b4f;--stfill:#fce9e5;}
#stmt-overlay.theme-reference .stmt-copy.recv{--stc:#2b91b5;--stfill:#e6f5fa;}
#stmt-overlay.theme-blue .stmt-copy{--stc:#1a4f9c;--stfill:#eaf2fc;}
#stmt-overlay.theme-navy .stmt-copy{--stc:#183153;--stfill:#e8edf3;}
#stmt-overlay.mono .stmt-sheet{--dc:#000;}
#stmt-overlay.mono .stmt-copy{--stc:#000;--stfill:#f2f2f2;}

/* 전표 (판매/구매/견적) */
.vch-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.vch-tab{padding:6px 14px;border-radius:18px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:600;color:var(--text);}
.vch-tab.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.vch-workspace{width:min(1120px,100%);}
.vch-list-workspace{width:min(1380px,100%);}
.vch-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;max-width:920px;}
.vch-head label.fld{gap:2px;font-size:11px;}
.vch-head label.fld input,.vch-head label.fld select{padding:5px 8px;font-size:12px;min-height:30px;}
.vch-grid{width:100%;border-collapse:collapse;min-width:800px;}
.vch-grid th{background:var(--bg);font-size:12px;font-weight:600;padding:7px 6px;border:1px solid var(--border);color:var(--muted);}
.vch-grid td{border:1px solid var(--border);padding:0;}
.vch-grid td input{width:100%;border:none;padding:7px 8px;font-size:12.5px;background:transparent;outline:none;box-sizing:border-box;}
.vch-grid td input:focus{background:#eaf3ff;}
.vch-grid .num-cell{padding:7px 8px;text-align:right;font-size:12.5px;background:var(--bg);color:var(--text);}
.vch-grid input[type=number]{text-align:right;}
.vch-grid tfoot td{background:var(--bg);font-weight:700;text-align:right;padding:7px 8px;font-size:12.5px;}
.vch-rowno{width:28px;text-align:center;background:var(--bg);font-size:11px;color:var(--muted);}
.vch-del{border:none;background:none;color:var(--danger);cursor:pointer;font-size:15px;width:26px;padding:0;}
.vch-grid .vch-action-col{width:30px!important;min-width:30px;background:transparent!important;border:none!important;padding:0!important;overflow:visible;}
.vch-grid .vch-action-col .vch-del{position:relative;left:5px;}
.vch-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--border);}
.vch-badge.ok{background:#d3f9d8;border-color:#8ce99a;color:#2b8a3e;}
.vch-page{display:flex;gap:4px;align-items:center;margin:12px 0 4px;flex-wrap:wrap;justify-content:center;}
.vch-page button{min-width:28px;height:28px;border:1px solid var(--border);background:var(--white);border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);}
.vch-page button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;}
.vch-print-btn{border:1px solid var(--border);background:var(--white);border-radius:5px;cursor:pointer;font-size:11.5px;padding:3px 9px;color:var(--text);}
.vch-print-btn.pr-on{background:#ff8c42;border-color:#ff8c42;color:#fff;font-weight:600;}
.vch-no-link{color:var(--primary);font-weight:600;cursor:pointer;white-space:nowrap;}
.vch-no-link:hover{text-decoration:underline;}
.vch-item-picker{position:relative;}
.vch-item-results{position:fixed;z-index:9500;width:320px;max-height:230px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:0 0 7px 7px;box-shadow:0 8px 22px rgba(0,0,0,.16);display:none;}
.vch-item-results.show{display:block;}
.vch-item-option{padding:7px 9px;font-size:11.5px;cursor:pointer;border-bottom:1px solid #f1f3f5;white-space:normal;}
.vch-item-option:hover{background:#eaf3ff;}
.vch-item-option small{display:block;color:var(--muted);margin-top:1px;}
.modal-bg:has(.voucher-edit-modal){align-items:center;padding:16px;background:rgba(22,34,56,.38);}
.voucher-edit-modal{position:relative;top:auto;left:auto;transform:none;width:min(1080px,calc(100vw - 32px))!important;height:auto!important;max-width:none;max-height:calc(100vh - 32px)!important;padding:0!important;overflow:hidden;border-radius:9px!important;display:flex;flex-direction:column;background:#f4f7fb;box-shadow:0 12px 38px rgba(15,35,75,.28);}
.voucher-modal-head{height:38px;flex:0 0 38px;display:flex;align-items:center;padding:0 9px 0 13px;background:var(--primary);border-bottom:1px solid #347bc9;color:#fff;cursor:move;user-select:none;}
.voucher-modal-head strong{font-size:13px;font-weight:700;}
.voucher-modal-head .meta{margin-left:12px;color:rgba(255,255,255,.78);font-size:10.5px;}
.voucher-modal-close{margin-left:auto;width:30px;height:30px;border:0;border-radius:5px;background:transparent;color:#fff;font-size:23px;line-height:1;cursor:pointer;padding:0;}
.voucher-modal-close:hover{background:rgba(255,255,255,.18);}
.voucher-modal-body{flex:0 1 auto;min-height:0;padding:9px 11px 0;overflow:auto;background:#f4f7fb;}
.voucher-modal-body>.vch-head{max-width:none;padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:9px;}
.voucher-modal-body>.actions{position:sticky;bottom:0;z-index:5;margin:12px -14px 0;padding:8px 14px;background:#fff;border-top:1px solid var(--border);box-shadow:0 -3px 12px rgba(30,55,85,.08);}

/* 인쇄 양식 (견적서/거래명세서) */
.q-doc{font-size:12px;color:#111;}
.q-doc table{border-collapse:collapse;width:100%;table-layout:fixed;}
.stmt-copy .q-doc td{border-color:var(--stc);}
.q-doc td{border:1px solid #444;padding:4px 7px;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#111;background:#fff;height:20px;}
.q-lbl{background:#f2f5fa!important;text-align:center;font-weight:700;color:var(--dc)!important;font-size:11px!important;}
#stmt-overlay.mono .q-lbl{background:#f2f2f2!important;}
.stmt-copy .q-lbl{background:#fff!important;color:var(--stc)!important;}
.stmt-copy .mn-items tr:nth-child(even):not(:last-child) td{background:var(--stfill)!important;}
.q-title{text-align:center;font-size:30px;font-weight:800;letter-spacing:16px;color:var(--dc);margin:2mm 0 5mm;text-decoration:underline;text-underline-offset:7px;}
.q-amt{border:2px solid #333;padding:6px 10px;font-size:14px;font-weight:700;margin:8px 0;display:flex;justify-content:space-between;color:#111;background:#fff;}
.q-doc .num{text-align:right;}
.q-doc .ctr{text-align:center;}
.mn-title{font-size:24px;font-weight:800;letter-spacing:10px;color:var(--stc,#111);text-align:center;}
.mn-cut{border:none;border-top:2px dashed #999;margin:7mm 0;position:relative;text-align:left;color:#999;font-size:11px;}
.mn-bank{font-size:12px;color:#111;padding:4px 2px;}
.doc-logo{display:inline-block;max-width:150px;max-height:46px;object-fit:contain;vertical-align:middle;}
.doc-stamp{display:inline-block;width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-left:3px;opacity:.9;}
.quote-brand-cell{height:46px!important;overflow:visible!important;}
.quote-brand-cell .doc-logo{max-width:172px;max-height:42px;}
.supplier-stamp-cell{position:relative;overflow:visible!important;padding-right:36px!important;}
.supplier-stamp-cell .doc-stamp{position:absolute;z-index:2;right:3px;top:50%;width:32px;height:32px;margin:0;transform:translateY(-50%);object-fit:contain;}
.mn-party-table .supplier-stamp-cell{padding-right:28px!important;}
.mn-party-table .supplier-stamp-cell .doc-stamp{right:1px;width:27px;height:27px;}
.statement-stamp-cell{position:relative;z-index:5;overflow:visible!important;}
.statement-stamp-cell .doc-stamp{position:absolute;z-index:8;top:50%;width:48px;height:48px;margin:0;transform:translateY(-50%);object-fit:contain;opacity:.92;pointer-events:none;}
.statement-stamp-cell.stamp-company .doc-stamp{right:-24px;}
.statement-stamp-cell.stamp-ceo .doc-stamp{right:-17px;}
.statement-items-wrap{position:relative;isolation:isolate;overflow:hidden;}
.statement-items-wrap .mn-items{position:relative;z-index:1;}
.stmt-copy .statement-items-wrap .mn-items tr:not(:first-child) td{background:rgba(255,255,255,.72)!important;}
.stmt-copy .statement-items-wrap .mn-items tr:nth-child(even):not(:last-child) td{background:color-mix(in srgb,var(--stfill) 72%,transparent)!important;}
.statement-watermark{position:absolute;z-index:0;left:50%;top:50%;height:auto;max-width:none;transform:translate(-50%,-50%);opacity:.28;pointer-events:none;}
.statement-watermark.watermark-small{width:58%;}
.statement-watermark.watermark-medium{width:82%;}
.statement-watermark.watermark-large{width:108%;}
.print-doc-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:auto;padding:5px 2px 0;border-top:1px solid #c8ced6;font-size:10px;color:#374151;}
.print-doc-footer>div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.print-doc-footer>div:last-child{text-align:right;}
.print-asset-preview{display:flex;align-items:center;gap:8px;min-height:48px;margin-top:5px;padding:6px 8px;border:1px dashed var(--border);border-radius:7px;background:#fafbfd;}
.print-asset-preview img{max-width:110px;max-height:48px;object-fit:contain;}
.print-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.print-asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px;}
.print-asset-card{padding:12px;border:1px solid var(--border);border-radius:10px;background:#fafbfd;}
.print-asset-card .print-asset-preview{min-height:82px;background:#fff;}
.print-asset-card .print-asset-preview img{max-width:180px;max-height:76px;}
.print-asset-guide{margin:7px 0 9px;font-size:10px;line-height:1.55;color:var(--muted);}
.print-asset-status{min-height:20px;margin-top:8px;font-size:12px;font-weight:700;color:var(--success);}
.print-asset-status.error{color:var(--danger);}
.vch-mobile-entry{display:none;}
.mn-head{display:grid;grid-template-columns:22% 1fr;border:1px solid var(--stc);border-bottom:0;}
.mn-date{display:grid;grid-template-rows:1fr 1fr;text-align:center;border-right:1px solid var(--stc);color:var(--stc);font-size:11px;}
.mn-date>div{display:flex;align-items:center;justify-content:center;padding:3px;}
.mn-date>div+div{border-top:1px solid var(--stc);}
.mn-heading{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;}
.mn-heading small{position:absolute;right:8px;bottom:4px;font-size:9px;letter-spacing:0;color:var(--stc);}
.mn-parties{display:grid;grid-template-columns:48% 52%;gap:0;}
.mn-party-table td{height:21px!important;}
.mn-items td{height:20px!important;padding:2px 4px!important;}

/* 달력 */
.cal-nav{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;}
.cal-nav button{background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px;}
.cal-head{font-size:11px;font-weight:700;color:var(--muted);padding:3px 0;}
.cal-head.sun{color:var(--danger);}.cal-head.sat{color:var(--primary);}
.cal-cell{min-height:46px;font-size:12px;padding:3px;cursor:pointer;border-radius:6px;border:1px solid transparent;position:relative;display:flex;flex-direction:column;align-items:center;user-select:none;}
.cal-cell:hover{background:#f0f2f5;}
.cal-cell.today{border-color:var(--primary);}
.cal-cell.today .d{color:var(--primary);font-weight:800;}
.cal-cell.drag{background:rgba(74,144,226,.25);}
.cal-cell .d{font-size:13px;}
.cal-cell.sun .d{color:var(--danger);}.cal-cell.sat .d{color:#2563eb;}.cal-cell.holiday .d{color:var(--danger);font-weight:800;}
.cal-cell.week-sel{background:#eaf3ff;}
.cal-cell.sel{background:var(--primary)!important;color:#fff;}
.cal-cell.sel .d{color:#fff!important;font-weight:800;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:2px;}
.cal-hol{font-size:8px;color:var(--danger);}

/* 박스형 월간 캘린더 (메인 캘린더 탭) */
.calbig{display:flex;flex-direction:column;height:100%;}
.calbig-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:0;border-left:1px solid var(--border);border-top:1px solid var(--border);flex:1;min-height:0;}
.calbig-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;user-select:none;min-height:78px;background:#fff;}
.calbig-cell.other{background:#fafbfc;}
.calbig-cell:hover{background:#f3f7fc;}
.calbig-cell.today{background:#eef5ff;}
.calbig-cell.drag{background:rgba(74,144,226,.18);}
.calbig-day{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text);}
.calbig-count{font-size:9px;font-weight:700;color:var(--primary);background:#e8f2ff;border-radius:8px;padding:1px 5px;white-space:nowrap;}
.calbig-cell.today .calbig-day{color:var(--primary);}
.calbig-cell.sun .calbig-day{color:var(--danger);}
.calbig-cell.sat .calbig-day{color:var(--primary);}
.calbig-cell.other .calbig-day{color:#c5ccd3;}
.calev{font-size:10px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;flex-shrink:0;}
.calev.sched{background:var(--primary);}
.calev.proj{background:var(--purple);}
.calev.tx{background:var(--orange);}
.calev.att{background:#7f8fa6;}
.calev.hol{background:transparent;color:var(--danger);font-weight:700;padding:0 5px;}
.calev.done{opacity:.45;text-decoration:line-through;}
.calev-more{display:inline-flex;align-self:flex-start;max-width:100%;font-size:10px;line-height:1.25;color:var(--text);font-weight:800;padding:1px 7px;border:1px solid var(--border);border-radius:999px;background:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.calbig-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;}
.calbig-head div{font-size:11px;font-weight:700;color:var(--muted);padding:5px 0;}
.calbig-head div.sun{color:var(--danger);}.calbig-head div.sat{color:var(--primary);}
/* 여러 날 이어지는 일정 바 (연속 표시) — flex 칸에서 너비 고정으로 칸을 꽉 채움 */
.calev.bar{color:#fff;border-radius:0;width:calc(100% + 10px);margin:0 -5px;padding-left:6px;padding-right:6px;flex-shrink:0;}
.calev.bar.start{border-radius:4px 0 0 4px;width:calc(100% + 5px);margin-left:0;margin-right:-5px;}
.calev.bar.end{border-radius:0 4px 4px 0;width:calc(100% + 5px);margin-left:-5px;margin-right:0;}
.calev.bar.single{border-radius:4px;width:100%;margin:0;}
.calev.bar.mid .bartext,.calev.bar.end .bartext{visibility:hidden;}

/* 캘린더: 클릭한 날 일정 목록 모달 */
.daylist-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;}
.daylist-item:hover{background:#f7f9fb;}
.daylist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* 프로젝트 게시글(포스트) */
.pj-post{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:box-shadow .2s,border-color .2s;}
.pj-post.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(74,144,226,.18);}
.pj-post .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pj-post .ava{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.pj-post .body{white-space:pre-wrap;font-size:13px;line-height:1.6;}
.pj-post .imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.pj-post .imgs img{max-width:180px;max-height:180px;border-radius:8px;border:1px solid var(--border);cursor:pointer;}
.mention{color:var(--primary);font-weight:700;background:#eaf3ff;border-radius:4px;padding:0 3px;}
.mention-box{position:absolute;z-index:9500;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:180px;overflow:auto;width:200px;}
.mention-box div{padding:7px 10px;font-size:12px;cursor:pointer;}
.mention-box div:hover,.mention-box div.active{background:#eaf3ff;}
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.emoji-pick span{font-size:18px;cursor:pointer;padding:3px 5px;border-radius:6px;}
.emoji-pick span:hover{background:#f0f2f5;}
.emoji-pick span.on{background:#dbeafe;}

/* 메모 테이블(dashboard 스타일) */
.memo-table{width:100%;border-collapse:collapse;font-size:13px;}
.memo-table th{background:#f7f9fb;font-weight:700;padding:8px;border-bottom:2px solid var(--border);font-size:12px;text-align:center;position:sticky;top:0;}
.memo-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.memo-table tr:hover td{background:#fafbfc;}
.memo-table .drag-h{cursor:grab;color:#c5ccd3;text-align:center;}
.memo-table .mt-done td{opacity:.5;text-decoration:line-through;}
.memo-row.dragover td{border-top:2px solid var(--primary);}
.memo-tag-square{width:12px;height:12px;border-radius:2px;background:var(--tag-color,#64748b);box-shadow:0 0 0 1px rgba(0,0,0,.08);display:inline-block;flex:0 0 12px;}
.memo-tag-settings-row{display:grid;grid-template-columns:28px minmax(120px,1fr) 54px 86px;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fafbfd;margin-bottom:7px;}
.memo-tag-settings-row input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;}
.memo-tag-settings-row input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--border);border-radius:6px;background:#fff;}
.memo-tag-order{display:flex;gap:4px}.memo-tag-order button{width:34px;height:30px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;}
.memo-tag-pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.memo-tag-pick .tag{font-size:13px;padding:7px 14px;cursor:pointer;border:1px solid transparent;}
.memo-tag-pick .tag.on{background:var(--primary);color:#fff;border-color:var(--primary);}

/* 공지 중요도 배경 */
.notice-row{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;}

.notice-row.important{background:#fff8e1;border-left:3px solid var(--orange);}
.notice-row.urgent{background:#ffeaec;border-left:3px solid var(--danger);}
.notice-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;}
.notice-badge.important{background:var(--orange);color:#fff;}
.notice-badge.urgent{background:var(--danger);color:#fff;}
.admin-page{height:calc(100vh - 84px);min-height:0;}
.panel.admin-page{display:flex;flex-direction:column;}
.notice-board{display:grid;grid-template-columns:minmax(260px,30%) minmax(360px,1fr) minmax(300px,340px);flex:1;min-height:0;overflow:hidden;}
.notice-column{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--border);background:#fff;}
.notice-column:last-child{border-right:0;}
.notice-column-head{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:800;background:#f9fafb;}
.notice-column-head.write{color:#ff5a65;background:#fff5f6;}
.notice-column-head.open{color:#ff4757;background:#fff4f5;}
.notice-column-body{flex:1;min-height:0;overflow:auto;}
.notice-compose{display:flex;flex-direction:column;gap:8px;height:100%;padding:12px;}
.notice-compose input,.notice-compose textarea,.notice-compose select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
.notice-compose textarea{flex:1;min-height:180px;resize:none;}
.notice-compose button{padding:11px;border:0;border-radius:8px;background:#ff4757;color:#fff;font-weight:800;cursor:pointer;}
.notice-board-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.notice-board-item:hover{background:#fafbfc;}
.notice-board-item .title{font-size:13px;font-weight:800;}
.notice-board-item .meta{font-size:10px;color:var(--muted);margin-top:3px;}
.notice-board-actions{display:flex;gap:5px;margin-top:7px;}
.notice-done-cal{padding:10px;border-bottom:1px solid var(--border);}
.attendance-page{display:flex;flex-direction:column;height:100%;min-height:0;}
.attendance-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.attendance-stat{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px;text-align:center;}
.attendance-stat .label{font-size:10px;color:var(--muted);}
.attendance-stat .value{font-size:20px;font-weight:800;margin-top:3px;}
.attendance-table-wrap{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px;}
.attendance-table{width:100%;border-collapse:collapse;font-size:12px;}
.attendance-table th{position:sticky;top:0;background:#f7f9fb;padding:9px;border-bottom:2px solid var(--border);z-index:1;}
.attendance-table td{padding:9px;border-bottom:1px solid var(--border);text-align:center;}

/* 멀티 검색 */
.search-cat{font-size:15px;font-weight:800;color:var(--text);margin:0 0 9px;}
.search-site-group:first-child .search-cat{font-size:19px;letter-spacing:-.2px;}
.search-site-group+.search-site-group{margin-top:26px}.search-site-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.site-chip{display:flex;align-items:center;justify-content:flex-start;gap:10px;min-height:58px;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;color:var(--text);box-shadow:0 2px 7px rgba(29,54,88,.06);}
.site-chip img{width:23px;height:23px;object-fit:contain;border-radius:5px;flex:0 0 23px;}
.site-chip:hover{border-color:#8dbcf0;background:#f7fbff}.site-chip.on{background:#eaf4ff;color:#1769b0;border:2px solid var(--primary);box-shadow:0 3px 10px rgba(52,130,214,.16);}
.search-hist{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #edf1f5;font-size:12px;cursor:pointer;}
.search-hist:hover{background:#f0f7ff;}
.search-hist-main{min-width:0;flex:1}.search-hist-keyword{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--text)}.search-hist-date{display:block;margin-top:2px;font-size:10px;color:var(--muted)}
.modal.search-modal{padding:0;overflow:hidden;height:min(660px,90vh);border-radius:12px;display:flex;flex-direction:column;}
.multi-search-head{height:42px;flex:0 0 42px;display:flex;align-items:center;padding:0 12px;background:#5596df;color:#fff;cursor:move;user-select:none;}
.multi-search-head strong{font-size:13px}.multi-search-head-actions{margin-left:auto;display:flex;align-items:center;gap:3px}.multi-search-head button{border:0;background:transparent;color:#fff;font-size:19px;cursor:pointer;width:30px;height:30px;border-radius:5px}.multi-search-head button:hover{background:rgba(255,255,255,.16)}
.multi-search-tabs{min-height:40px;flex:0 0 auto;display:flex;gap:5px;padding:0 12px;background:#f0f3f7;border-bottom:1px solid var(--border);align-items:flex-end;overflow-x:auto}.multi-search-tabs button{height:37px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:transparent;color:#506175;cursor:pointer;font-weight:700;white-space:nowrap}.multi-search-tabs button.on{color:var(--primary);border-bottom-color:var(--primary);background:#fff}.multi-search-tabs .search-work-link{margin-left:4px;border:1px solid #c7d6e6;border-bottom-width:1px;border-radius:18px;height:30px;padding:0 13px;align-self:center;background:#fff;color:#24527c}.multi-search-tabs .search-work-link:hover{border-color:var(--primary);color:var(--primary);background:#eaf4ff}
.multi-search-body{padding:14px 16px;overflow:hidden;min-height:0;flex:1;background:#fff;display:flex;flex-direction:column}.general-search-bar{display:flex;gap:8px;flex:0 0 auto;margin-bottom:12px}.general-search-bar input{flex:1;border:2px solid var(--primary);font-size:15px;padding:10px 12px}.general-search-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;min-height:0;flex:1}.general-search-sites{min-height:0;overflow-y:auto;padding:2px 6px 10px 1px}.search-history-panel{border-left:1px solid var(--border);padding-left:14px;display:flex;flex-direction:column;height:100%;min-height:0}.search-history-list{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
.search-link-group{margin-top:26px;padding-top:18px;border-top:1px dashed var(--border)}.search-link-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}.search-link-card{min-height:52px;border:1px solid #cbd9e8;border-radius:9px;background:#f7faff;color:#24527c;font-weight:800;cursor:pointer;box-shadow:0 2px 7px rgba(29,54,88,.06)}.search-link-card:hover{background:#eaf4ff;border-color:var(--primary)}
.all-search-bar{display:flex;gap:8px}.all-search-bar input{flex:1;border:2px solid var(--primary);font-size:15px;padding:10px 12px}.all-search-summary{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:9px 2px}.all-search-summary-total{margin-right:3px;font-weight:700}.all-search-category-nav{border:1px solid var(--border);border-radius:14px;background:#fff;color:#506175;padding:4px 9px;font-size:11px;cursor:pointer}.all-search-category-nav:hover{border-color:var(--primary);color:var(--primary);background:#f4f9ff}.all-search-results{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--border)}.all-search-category{margin-bottom:8px;scroll-margin-top:34px}.all-search-category-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:8px 10px;background:#f3f6fa;border-bottom:1px solid var(--border);font-size:12px}.all-search-category-head span{color:var(--muted)}.all-search-result{display:flex;flex-direction:column;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--border);background:#fff;cursor:pointer}.all-search-result:hover{background:#f4f9ff}.all-search-result strong{font-size:12px;color:var(--text)}.all-search-result small{margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-link-settings{display:flex;flex-direction:column;gap:8px}.search-link-row{display:grid;grid-template-columns:160px minmax(0,1fr) 34px;gap:8px;align-items:end;padding:10px;border:1px solid var(--border);border-radius:9px;background:#fafbfd}.search-link-row .fld{min-width:0}.search-link-row input{width:100%}.search-link-remove{height:34px;border:1px solid #f2b8b5;border-radius:7px;background:#fff;color:var(--danger);cursor:pointer}.search-link-remove:hover{background:#fff1f1}
@keyframes searchTargetPulse{0%,100%{background:inherit;box-shadow:none}50%{background:#fff3a8;box-shadow:0 0 0 3px rgba(255,193,7,.35)}}
.search-target-flash,.search-target-flash td{animation:searchTargetPulse .78s ease-in-out 3!important;}

/* 리스트/테이블 */
table.grid{width:100%;border-collapse:collapse;font-size:12px;}
table.grid th,table.grid td{border:1px solid var(--border);padding:6px 8px;text-align:left;white-space:nowrap;}
table.grid th{background:#f7f9fb;font-weight:700;position:sticky;top:0;}
table.grid th[draggable="true"]{cursor:grab;user-select:none;}
table.grid th.drag-over{box-shadow:inset 3px 0 var(--primary);}
table.grid tr:hover td{background:#fafbfc;}
.tx-type{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.tx-buy{background:#fff1d6;color:#b36b00}.tx-sell{background:#e8f3ff;color:#1976c9}.tx-return{background:#f3e8ff;color:#7b2cbf}.tx-adjust{background:#e9f8ef;color:#16824b}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 220px);}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#eef2ff;color:var(--secondary);}
.chip{display:inline-block;padding:3px 9px;border:1px solid var(--border);border-radius:14px;font-size:11px;cursor:pointer;margin:2px;background:#fff;}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.inventory-data-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 12px;margin:-4px 0 12px;background:#f7f9fb;border:1px solid var(--border);border-radius:8px}.inventory-data-filter.hide{display:none}.inventory-data-filter label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}.inventory-data-filter input,.inventory-data-filter select{min-width:115px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff}
.vch-contact-link{border:0;background:transparent;color:var(--primary);font-weight:700;cursor:pointer;padding:0}.vch-contact-link:hover{text-decoration:underline}.vch-history-list{max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:8px}.vch-history-row{width:100%;display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:#fff;text-align:left;cursor:pointer}.vch-history-row:hover{background:#f5f9ff}.vch-history-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vch-history-row strong{text-align:right;color:var(--primary)}

.list-item{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;}
.list-item:hover{background:#fafbfc;}
.list-item .meta{font-size:11px;color:var(--muted);margin-top:2px;}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.inp{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);}
label.fld input,label.fld select,label.fld textarea{padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9000;}
.modal{background:#fff;border-radius:12px;padding:20px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{font-size:16px;margin-bottom:14px;}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.modal .full{grid-column:1/3;}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.project-context-menu{position:fixed;z-index:9900;min-width:190px;padding:6px;background:#fff;border:1px solid #d8e0e8;border-radius:9px;box-shadow:0 10px 28px rgba(20,34,50,.22);font-size:12px;}
.project-context-title{padding:7px 9px 8px;margin-bottom:4px;border-bottom:1px solid var(--border);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.project-context-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:#fff;color:var(--text);font:inherit;text-align:left;cursor:pointer;}
.project-context-menu button:hover{background:#edf5ff;color:var(--primary);}
.project-context-menu button.danger{color:var(--danger);}.project-context-menu button.danger:hover{background:#fff0f1;color:#d63040;}

/* 프로젝트 */
.pj-layout{display:grid;grid-template-columns:220px minmax(360px,1fr) 260px;gap:12px;height:100%;}
.pj-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;}
.pj-card:hover{border-color:var(--primary);}
.pj-card .who{font-size:11px;color:var(--muted);margin-bottom:4px;}
.cmt{margin:6px 0 6px 12px;padding:7px 10px;background:#f7f9fb;border-radius:8px;font-size:12px;}
.cmt.reply{margin-left:34px;background:#eef2ff;}
.proj-list-item.active,.history-item.active{background:#eaf3ff;border-left:3px solid var(--primary);}
.history-item{padding:10px;border-bottom:1px solid var(--border);cursor:pointer;}
.history-item:hover{background:#f7f9fb;}
.editor-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
.editor-tools button{padding:4px 8px;border:1px solid var(--border);background:#fff;border-radius:5px;cursor:pointer;font-size:11px;}
.project-block{margin-top:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.project-block .block-title{padding:7px 10px;background:#f7f9fb;font-size:12px;font-weight:700;}
.project-block table{width:100%;border-collapse:collapse;font-size:12px;}
.project-block td{border-top:1px solid var(--border);padding:7px 9px;}
.project-block td:last-child{width:130px;text-align:center;}
.inventory-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.inventory-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 14px 14px 22px;box-shadow:0 1px 5px rgba(0,0,0,.04);overflow:hidden;}
.inventory-card .stock-bar{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--primary);}
.inventory-card .stock-bar.low{background:var(--danger);}
.inventory-card .stock-bar.empty{background:#a4b0be;}
.inventory-card .stock-bar.good{background:var(--success);}
.inventory-card .sku{font-size:11px;color:var(--primary);font-weight:700;}
.inventory-card .name{font-size:16px;font-weight:700;margin:5px 0 10px;}
.inventory-card .info{font-size:12px;color:var(--muted);line-height:1.8;}

/* 월간·연간 선 차트 */
.report-visuals{display:grid;grid-template-columns:minmax(0,8fr) minmax(170px,2fr);gap:12px;}
.report-summary{display:flex;gap:12px;margin-bottom:14px;}
.report-summary .panel{flex:1;text-align:center;}
.line-chart-wrap{border:1px solid var(--border);border-radius:8px;background:#fff;overflow-x:auto;padding:8px 10px 2px;}
.line-chart{display:block;width:100%;min-width:720px;height:300px;}
.line-grid{stroke:#dfe5eb;stroke-width:1;}
.line-axis{stroke:#9aa7b2;stroke-width:1.2;}
.line-sell{fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;}
.line-buy{fill:none;stroke:var(--orange);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;}
.line-dot-sell{fill:#fff;stroke:var(--primary);stroke-width:3;}
.line-dot-buy{fill:#fff;stroke:var(--orange);stroke-width:3;}
.chart-axis-label{font-size:12px;fill:#697786;font-weight:600;}
.chart-month-label{font-size:13px;fill:#53606d;font-weight:700;}
.contact-picker{position:relative;}
.contact-results{position:absolute;left:0;right:0;top:100%;z-index:9200;background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 7px 20px rgba(0,0,0,.15);max-height:180px;overflow:auto;display:none;}
.contact-results.show{display:block;}
.contact-option{padding:8px 10px;cursor:pointer;color:var(--text);font-size:12px;}
.contact-option:hover{background:#eaf3ff;}
.contact-option .meta{font-size:10px;color:var(--muted);}
.calendar-mode-tabs{display:flex;gap:6px;margin-bottom:12px;}
.calendar-mode-tabs button{padding:7px 18px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-weight:700;}
.calendar-mode-tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.day-calendar-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,3fr) minmax(0,4fr);gap:14px;height:calc(100vh - 135px);}
.day-date-card{padding:22px;text-align:center;}
.day-date-card .year{font-size:18px;color:var(--muted);}
.day-date-card .month{font-size:42px;font-weight:800;line-height:1.15;color:var(--primary);}
.day-date-card .day{font-size:64px;font-weight:900;line-height:1;}
.day-date-card .weekday{font-size:22px;font-weight:700;margin-top:8px;}
.day-mini-cal{margin-top:18px;}
.day-timeline{overflow:auto;padding:6px 14px 14px;user-select:none;-webkit-user-select:none;touch-action:none;}
.timeline-grid{position:relative;min-height:1296px;}
.time-row{display:grid;grid-template-columns:70px 1fr;min-height:54px;border-bottom:1px solid var(--border);}
.time-label{padding:9px 10px;color:var(--muted);font-size:12px;border-right:1px solid var(--border);}
.time-events{cursor:crosshair;background:linear-gradient(to bottom,transparent 49%,rgba(223,229,235,.65) 50%,transparent 51%);}
.timeline-events-layer{position:absolute;top:0;bottom:0;left:70px;right:0;pointer-events:none;}
.time-event{position:absolute;z-index:3;background:linear-gradient(135deg,#dcecff,#eef6ff);color:#185d9d;border-left:3px solid var(--primary);border-radius:5px;padding:3px 5px;font-size:10px;line-height:1.2;cursor:pointer;pointer-events:auto;overflow:hidden;box-shadow:0 2px 6px rgba(36,105,168,.13);transition:transform .14s,box-shadow .14s;}
.time-event:hover{transform:translateX(2px);box-shadow:0 4px 12px rgba(36,105,168,.22);}
.time-event .event-time{display:block;font-size:9px;font-weight:700;opacity:.75;margin-bottom:1px;white-space:nowrap;}
.time-event b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.current-time-line{position:absolute;left:0;right:0;z-index:5;height:2px;background:#e53935;pointer-events:none;box-shadow:0 0 4px rgba(229,57,53,.35);}
.current-time-line:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e53935;}
.current-time-label{position:absolute;right:4px;top:-9px;background:#e53935;color:#fff;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:800;white-space:nowrap;}
.time-selection{position:absolute;left:4px;right:4px;z-index:2;border:2px solid var(--primary);border-radius:8px;background:rgba(45,125,210,.18);pointer-events:none;animation:timeSelectPulse .7s ease-in-out infinite alternate;}
@keyframes timeSelectPulse{from{box-shadow:0 0 0 0 rgba(45,125,210,.12)}to{box-shadow:0 0 0 5px rgba(45,125,210,.08)}}
.todo-panel{display:flex;flex-direction:column;min-height:0;}
.todo-panel .pb{overflow:auto;flex:1;}
.todo-auto-hint{margin-bottom:7px;font-size:9px;line-height:1.3;color:var(--muted);}
.todo-entry-row{display:flex;gap:6px;align-items:stretch;margin-bottom:8px;}
.todo-token-editor{flex:1;min-width:0;min-height:34px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);outline:none;line-height:20px;cursor:text;}
.todo-token-editor:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 18%,transparent);}
.todo-token-editor:empty:before{content:attr(data-placeholder);color:var(--muted);pointer-events:none;}
.todo-token-chip{display:inline-flex;align-items:center;max-width:100%;margin:0 2px 1px 0;padding:1px 8px;border:1px solid #dfe2ff;border-radius:999px;background:#f0f1ff;color:#5361e8;font-size:10px;font-weight:800;line-height:18px;vertical-align:middle;white-space:nowrap;}
.todo-token-chip.time{border-color:#cfe7ff;background:#edf7ff;color:#2571b8;}
.todo-content-cell{line-height:24px;word-break:break-word;}
.daily-todo-table{width:100%;border-collapse:collapse;font-size:12px;}
.daily-todo-table td,.daily-todo-table th{padding:7px;border:1px solid var(--border);}
.todo-delete-btn{display:inline-flex;align-items:center;justify-content:center;min-width:48px;white-space:nowrap;writing-mode:horizontal-tb;line-height:1;padding:6px 8px;}
.week-calendar-layout{display:grid;grid-template-rows:minmax(300px,.85fr) minmax(270px,1fr);gap:14px;height:calc(100vh - 135px);min-height:0;}
.week-calendar-top{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;min-height:0;}
.week-month-panel,.week-board-panel,.week-plans-panel{display:flex;flex-direction:column;min-width:0;min-height:0;}
.week-month-panel .pb{overflow:auto;}
.week-board-head{gap:10px;}
.week-start-setting{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;}
.week-start-setting select{padding:4px 7px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font-size:11px;}
.week-days-grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));flex:1;width:100%;min-height:0;overflow:auto;border-top:1px solid var(--border);}
.week-day-column{display:flex;flex-direction:column;min-width:92px;border-right:1px solid var(--border);background:#fff;}
.week-day-column:last-child{border-right:0;}
.week-day-column.today{background:linear-gradient(180deg,#f4f9ff,#fff 36%);}
.week-day-column.outside .week-day-date{color:#9ba7b4;}
.week-day-head{position:sticky;z-index:4;top:0;display:flex;flex:0 0 auto;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:6px;border-bottom:1px solid var(--border);cursor:pointer;background:#f8fafc;box-shadow:0 1px 0 rgba(23,40,58,.04);}
.week-day-head:hover{background:#edf4fc;}
.week-day-name{font-size:11px;font-weight:800;color:var(--muted);}
.week-day-date{display:grid;place-items:center;min-width:27px;width:auto;height:27px;padding:0 5px;border-radius:999px;font-size:13px;font-weight:800;}
.week-day-column.sun .week-day-name,.week-day-column.sun .week-day-date{color:var(--danger);}
.week-day-column.sat .week-day-name,.week-day-column.sat .week-day-date{color:var(--primary);}
.week-day-column.holiday .week-day-name,.week-day-column.holiday .week-day-date{color:var(--danger)!important;}
.week-day-column.today .week-day-date{background:var(--primary);color:#fff;box-shadow:0 4px 9px rgba(37,99,235,.28);}
.week-day-column.today.holiday .week-day-date{background:#fff0f0;color:var(--danger)!important;box-shadow:0 4px 9px rgba(217,72,72,.2);}
.week-day-items{flex:1;min-height:0;overflow:auto;padding:5px;}
.week-day-items .daylist-item{align-items:flex-start;gap:5px;margin-bottom:5px;padding:6px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:10px;line-height:1.35;}
.week-day-items .daylist-item:last-child{border-bottom:1px solid var(--border);}
.week-day-items .daylist-dot{width:6px;height:6px;margin-top:4px;}
.week-day-items .empty{padding:14px 3px;font-size:10px;}
.week-plan-grid{display:flex;flex:1;align-items:stretch;gap:10px;box-sizing:border-box;width:100%;padding:14px 12px 10px;overflow-x:auto;overflow-y:visible;min-height:0;}
.week-plan-card{display:grid;grid-template-rows:auto minmax(42px,1fr) auto;flex:1 1 0;min-width:145px;border:1px solid var(--border);border-radius:11px;background:#fff;overflow:hidden;min-height:0;cursor:pointer;transition:flex-grow .18s ease,transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.week-plan-card.active{flex-grow:1.35;transform:translateY(-5px);border-color:#7db1ff;background:linear-gradient(145deg,#fff,#edf6ff);box-shadow:0 7px 16px rgba(37,99,235,.22),inset 0 1px 0 rgba(255,255,255,.95);}
.week-plan-card.disabled{opacity:.45;cursor:default;}
.week-plan-card h4{display:flex;align-items:center;gap:6px;padding:8px 11px;background:#f7f9fb;font-size:12px;white-space:nowrap;}
.week-plan-card.active h4{background:#e7f2ff;color:var(--primary);font-size:13px;}
.week-plan-current{margin-left:auto;padding:2px 6px;border-radius:999px;background:var(--primary);color:#fff;font-size:9px;font-weight:800;}

.week-plan-card.active textarea{background:transparent;}
.week-plan-actions{padding:4px 10px 7px;text-align:right;background:#fff;}
.week-plan-card.active .week-plan-actions{background:transparent;}
.week-plan-actions .tb-btn{white-space:nowrap;}
.time-picker-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.slot-picker{border:1px solid var(--border);border-radius:10px;padding:8px;background:#f8fafc;}
.slot-picker-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-align:center;}
.slot-picker-controls{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:5px;}
.slot-col{display:grid;grid-template-rows:24px 38px 24px;text-align:center;overflow:hidden;border-radius:8px;background:#fff;border:1px solid var(--border);}
.slot-col button{border:0;background:#f1f5f9;color:#526170;cursor:pointer;font-size:12px;}
.slot-col button:hover{background:#e2edfa;color:var(--primary);}
.slot-value{display:grid;place-items:center;font-size:20px;font-weight:800;cursor:pointer;outline:none;}
.slot-value:focus{box-shadow:inset 0 0 0 2px var(--primary);}
.slot-sep{text-align:center;font-weight:900;color:var(--muted);}
.slot-hint{text-align:center;font-size:10px;color:var(--muted);margin-top:5px;}
.schedule-color-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.schedule-color-row input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;}
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;}
.color-swatch{width:25px;height:25px;border:2px solid #fff;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--border);}
.color-swatch.on{box-shadow:0 0 0 2px #24364b;}
@media(max-width:900px){.day-calendar-layout{grid-template-columns:1fr;height:auto;grid-template-rows:auto 720px auto}.week-calendar-layout{height:auto;grid-template-rows:auto auto}.week-calendar-top{grid-template-columns:1fr}.week-days-grid{min-height:280px}.week-plan-card{flex:0 0 160px}.week-plan-card.active{flex-basis:215px}}
.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;padding:12px;min-height:210px;}
.donut{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;}

.donut-legend{font-size:11px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.8;}

@media(max-width:900px){.modal.contact-modal{width:94vw!important}.pj-layout{grid-template-columns:1fr}.pj-history-panel{grid-column:auto}.home-grid{grid-template-columns:1fr;height:auto}.notice-board{grid-template-columns:1fr;height:auto}.notice-column{min-height:420px}.attendance-summary{grid-template-columns:repeat(2,1fr)}}

.tab-btns{display:flex;gap:6px;margin-bottom:10px;}
.tab-btns button{padding:6px 14px;border:1px solid var(--border);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;}
.tab-btns button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.hide{display:none!important;}
.settings-shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:start}
.settings-nav{padding:8px;position:sticky;top:0}
.settings-title{font-size:18px;font-weight:800;padding:8px 10px 12px;margin-bottom:4px;border-bottom:1px solid var(--border);white-space:nowrap}
.settings-mobile-title{display:none}
.settings-nav button{display:flex;width:100%;align-items:center;gap:8px;padding:10px 12px;border:0;background:transparent;border-radius:7px;text-align:left;cursor:pointer;color:var(--text);font-size:12px;margin:2px 0}

.settings-view{min-width:0}.settings-view>.panel{margin-bottom:14px}
.shortcut-grid{display:flex;flex-direction:column;gap:8px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shortcut-head,.shortcut-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center}.shortcut-head{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--border)}
.shortcut-card select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font:inherit}.quick-card{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px;background:#fff;font-size:12px}

.quick-launch{display:flex;gap:5px;align-items:center;overflow:auto;max-width:52vw}.quick-launch .tb-btn{white-space:nowrap}
.mobile-sidebar-backdrop{display:none}

.scan-sku{font-size:18px;font-weight:800;letter-spacing:.5px}.scan-item-name{font-size:15px;font-weight:700;margin-top:4px}
/* ── 실시간 바코드 스캐너 ── */
#bc-scanner{position:fixed;inset:0;background:#000;z-index:9700;overflow:hidden}

const $=s=>document.querySelector(s);
const el=id=>document.getElementById(id);
const won=n=>(Number(n)||0).toLocaleString('ko-KR');
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escQ=s=>(s==null?'':String(s)).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
const fmt=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const schedJson=s=>esc(JSON.stringify(s)).replace(/"/g,'&quot;');
async function api(url,opt){const r=await fetch(url,opt);return r.json();}
let actionRefreshTimer=null;
const ACTION_REFRESH_RULES=[
  ['/api/notices',['home','notices']],['/api/attendance',['home','settings']],
  ['/api/schedules',['home','calendar']],['/api/calendar',['home','calendar']],
  ['/api/projects',['home','projects']],['/api/memo',['home','memo']],
  ['/api/contacts',['contacts']],['/api/items',['items','inventory']],
  ['/api/tx',['home','inout','inventory','report']],['/api/vouchers',['voucher']],
  ['/api/inventory',['inventory']],['/api/settings',['settings']],['/api/account/update',['settings']],
  ['/api/users',['settings']],['/api/dummy-data',['settings']],
  ['/api/restore',['settings']]
];
function scheduleActionRefresh(url,result){
  if(result?.ok===false||result?.error)return;
  const rule=ACTION_REFRESH_RULES.find(([prefix])=>url.startsWith(prefix));
  if(!rule||!rule[1].includes(CUR_TAB))return;
  clearTimeout(actionRefreshTimer);
  actionRefreshTimer=setTimeout(()=>{actionRefreshTimer=null;const render=RENDER[CUR_TAB];if(render)Promise.resolve(render()).catch(()=>{});},200);
}
async function post(url,body,refresh=true){const result=await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(refresh)scheduleActionRefresh(url,result);return result;}
async function postForm(url,body,refresh=true){const response=await fetch(url,{method:'POST',body});const result=await response.json();if(response.ok&&refresh)scheduleActionRefresh(url,result);return result;}
function isAdmin(){return ME.role==='admin';}

function showRegister(){showAuthForm('register-form');}

async function doRegister(){
  const r=await post('/api/register',{username:el('rg-user').value,password:el('rg-pw').value,
    name:el('rg-name').value,email:el('rg-email').value,birthday:el('rg-birth').value,dept:el('rg-dept').value,

}
async function loadSecurityQuestion(){
  const r=await post('/api/account/security-question',{username:el('reset-user').value,email:el('reset-email').value});
  el('reset-pw-err').textContent=r.ok?'':r.error;
  el('reset-answer-area').classList.toggle('hide',!r.ok);
  el('reset-question').textContent=r.ok?r.question:'';
}
async function resetPassword(){
  const pw=el('reset-new-pw').value;
  if(pw!==el('reset-new-pw2').value){el('reset-pw-err').textContent='새 비밀번호가 서로 일치하지 않습니다.';return;}
  const r=await post('/api/account/reset-password',{username:el('reset-user').value,email:el('reset-email').value,
    security_answer:el('reset-answer').value,new_password:pw});
  if(!r.ok){el('reset-pw-err').textContent=r.error;return;}
  alert('비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.');showLogin();

function securityQuestionOptions(selected){

  return `<option value="">질문 선택</option>`+questions.map(q=>`<option ${q===selected?'selected':''}>${q}</option>`).join('');
}

function startApp(){

function renderTopDate(){

  const date=`${d.getFullYear()}년 ${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일 (${w})`;

  el('topbar-date').innerHTML=esc(date)+url;

function openMobileQrModal(){
  const url=ME.mobile_url;if(!url)return;
  modal(`<h3>📱 모바일 접속</h3>
   <p class="meta" style="margin-bottom:12px;line-height:1.6">같은 네트워크에 연결된 휴대폰 카메라로 아래 QR코드를 찍으면 바로 접속할 수 있습니다.</p>
   <div style="display:flex;justify-content:center;padding:14px;background:#fff;border-radius:10px;"><img src="/api/mobile-qr?t=${Date.now()}" alt="모바일 접속 QR코드" style="width:220px;height:220px;"></div>

   <div class="actions"><button class="tb-btn btn-gray" onclick="closeModal()">닫기</button><button class="tb-btn btn-primary" onclick="copyMobileUrl(this)">주소 복사</button></div>`,380);
}
async function copyMobileUrl(btn){
  const url=ME.mobile_url;if(!url)return;
  try{await navigator.clipboard.writeText(url);}
  catch(e){const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  const target=btn||document.querySelector('.topbar-mobile-url');
  if(target){const old=target.innerHTML;target.innerHTML='✅ 복사됨';setTimeout(()=>{target.innerHTML=old;},1200);}

// ════════ 사이드바 ════════
function toggleSidebar(){
  if(innerWidth<=700){const open=!el('sidebar').classList.contains('mobile-open');el('sidebar').classList.toggle('mobile-open',open);el('mobile-sidebar-backdrop').classList.toggle('show',open);}
  else el('sidebar').classList.toggle('collapsed');
}
function closeMobileSidebar(){el('sidebar').classList.remove('mobile-open');el('mobile-sidebar-backdrop').classList.remove('show');}
let sidebarTouchStartX=null;
el('sidebar').addEventListener('touchstart',e=>{sidebarTouchStartX=e.touches[0]?.clientX??null;},{passive:true});
el('sidebar').addEventListener('touchend',e=>{if(sidebarTouchStartX==null)return;const end=e.changedTouches[0]?.clientX??sidebarTouchStartX;if(end-sidebarTouchStartX < -55)closeMobileSidebar();sidebarTouchStartX=null;},{passive:true});
function restoreCurrentNavSelection(){document.querySelectorAll('.nav-item[data-tab]').forEach(item=>item.classList.toggle('active',item.dataset.tab===CUR_TAB));}
function toggleSidebarMenu(menuId,navId){
  const opening=!el(menuId).classList.contains('open');
  closeSidebarMenus();
  if(opening){
    document.querySelectorAll('.nav-item[data-tab]').forEach(item=>item.classList.remove('active'));

  el('submenu').classList.remove('open');el('nav-manage').classList.remove('active');
  el('vch-submenu').classList.remove('open');el('nav-voucher').classList.remove('active');
}
function switchTab(t){
  const manageTabs=new Set(['contacts','items','inventory','inout','report']);
  if(t==='voucher'){
    el('submenu').classList.remove('open');el('nav-manage').classList.remove('active');
    el('vch-submenu').classList.add('open');el('nav-voucher').classList.add('active');
  }else if(manageTabs.has(t)){
    el('vch-submenu').classList.remove('open');el('nav-voucher').classList.remove('active');
    el('submenu').classList.add('open');el('nav-manage').classList.add('active');
  }else closeSidebarMenus();
  CUR_TAB=t;
  document.querySelectorAll('.nav-item[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));
  document.querySelectorAll('.content').forEach(e=>e.classList.remove('active'));
  el('tab-'+t).classList.add('active');
  const r=RENDER[t],rendered=r?r():null;
  document.querySelectorAll('#m-bottomnav [data-mtab]').forEach(b=>b.classList.toggle('on',b.dataset.mtab===t));
  if(isMobile()){closeMobileSidebar();window.scrollTo({top:0});}
  return rendered;
}

let miniY=new Date().getFullYear(),miniM=new Date().getMonth(),MINI_HOLIDAYS=null;
async function renderMiniCal(){
  if(MINI_HOLIDAYS===null){
    try{const data=await api('/api/schedules');MINI_HOLIDAYS=new Set((data.holidays||[]).map(h=>h.date));}
    catch(e){MINI_HOLIDAYS=new Set();}
  }
  const first=new Date(miniY,miniM,1),start=first.getDay(),days=new Date(miniY,miniM+1,0).getDate();
  const td=new Date();
  let h=`<div class="mc-head"><button onclick="miniMove(-1)">‹</button>${miniM+1}월<button onclick="miniMove(1)">›</button></div>`;
  h+='<table><tr>'+['일','월','화','수','목','금','토'].map((d,i)=>`<th class="${i===0?'sun':i===6?'sat':''}">${d}</th>`).join('')+'</tr><tr>';
  for(let i=0;i<start;i++)h+='<td></td>';
  for(let d=1;d<=days;d++){
    const isT=d===td.getDate()&&miniM===td.getMonth()&&miniY===td.getFullYear();
    const dow=(start+d-1)%7,ds=`${miniY}-${String(miniM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    h+=`<td data-date="${ds}" class="${isT?'today ':''}${dow===0?'sun':dow===6?'sat':''} ${MINI_HOLIDAYS.has(ds)?'holiday':''}">${d}</td>`;
    if((start+d)%7===0)h+='</tr><tr>';
  }
  h+='</tr></table>';el('mini-cal').innerHTML=h;
}
function miniMove(n){miniM+=n;if(miniM<0){miniM=11;miniY--;}if(miniM>11){miniM=0;miniY++;}renderMiniCal();}

let NOTIFICATIONS=[];
async function loadNotifications(){
  try{NOTIFICATIONS=await api('/api/notifications');}catch(e){NOTIFICATIONS=[];}
  const box=el('mention-alert');if(!box)return;
  box.classList.toggle('show',NOTIFICATIONS.length>0);
  if(!NOTIFICATIONS.length){box.innerHTML='';return;}
  const first=NOTIFICATIONS[0],more=NOTIFICATIONS.length-1;
  box.innerHTML=`<span>🔔</span><span class="text">${esc(first.actor||'사용자')}님의 멘션${more?` 외 ${more}건`:''}</span>
    <button class="dismiss" title="알림 모두 끄기" onclick="event.stopPropagation();dismissNotifications(true)">∨</button>`;
}
function openNotifications(){
  const rows=NOTIFICATIONS.map(n=>`<div class="daylist-item" onclick="dismissNotifications(false,${n.id});closeModal();gotoProject(${n.project_id})">
    <span class="daylist-dot" style="background:var(--primary)"></span>
    <div style="min-width:0;flex:1;"><b>${esc(n.actor||'사용자')}</b> · ${esc(n.emoji||'📁')} ${esc(n.project_name||'프로젝트')}

function runShortcutAction(action){
  if(action==='stock_in')return openStockModal('in');
  if(action==='stock_out')return openStockModal('out');
  if(action==='search')return openSearch();
  if(action==='memo'){switchTab('memo');return setTimeout(()=>el('memo-input')?.focus(),100);}
  if(action==='home')return switchTab('home');
  if(action==='projects')return switchTab('projects');
  if(action==='contact')return openContactModal();
  if(action==='attendance')return openAttendance();
  if(action.startsWith('tab_'))return switchTab(action.slice(4));
  if(action.startsWith('calendar_')){calendarMode=action.split('_')[1];switchTab('calendar');return;}
  if(action==='help_manual')return window.open('/static/manual.html','_blank');
}
function shortcutCode(e){
  if(e.ctrlKey&&e.key==='1')return'ctrl_1';
  if(e.shiftKey&&e.code==='Space')return'shift_space';
  if(!e.shiftKey&&!e.ctrlKey&&!e.altKey&&e.code==='Space')return'space';
  return /^F([1-9]|1[0-2])$/.test(e.key)?e.key.toLowerCase():'';
}
document.addEventListener('keydown',e=>{
  const target=e.target,typing=target?.matches?.('input,textarea,select,[contenteditable="true"]');
  if(typing)return;
  const code=shortcutCode(e),action=USER_PREFS.shortcuts[code];
  if(action){e.preventDefault();runShortcutAction(action);}
});
// 숫자 입력칸은 포커스 여부와 관계없이 마우스를 올린 채 휠로 증감한다.
document.addEventListener('wheel',e=>{
  const input=e.target?.closest?.('input[type="number"]');
  if(!input||input.disabled||input.readOnly)return;
  e.preventDefault();input.focus({preventScroll:true});
  const direction=e.deltaY<0?1:-1,rawStep=input.getAttribute('step'),step=rawStep&&rawStep!=='any'?(Number(rawStep)||1):1;
  const min=input.min!==''?Number(input.min):-Infinity,max=input.max!==''?Number(input.max):Infinity;
  const next=Math.min(max,Math.max(min,(Number(input.value)||0)+direction*step));
  input.value=String(next);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));
},{passive:false,capture:true});

let USERS=[],mentionOpen=false,mentionStart=-1,mentionIdx=0,mentionMatches=[];
async function loadUsers(){try{USERS=await api('/api/users');}catch(e){USERS=[];}}
function mentionInput(e,id){
  const ta=el(id);const pos=ta.selectionStart;const text=ta.value.slice(0,pos);
  const m=text.match(/@([\w가-힣]*)$/);
  if(m){mentionStart=pos-m[0].length;const q=m[1].toLowerCase();
    mentionMatches=USERS.filter(u=>(u.username+(u.name||'')).toLowerCase().includes(q)).slice(0,6);
    if(mentionMatches.length){mentionIdx=0;showMentionBox(ta,id);mentionOpen=true;return;}
  }
  hideMentionBox();
}
function showMentionBox(ta,id){
  const r=ta.getBoundingClientRect();
  let box=el('mention-box');if(!box){box=document.createElement('div');box.id='mention-box';box.className='mention-box';document.body.appendChild(box);}
  box.style.left=r.left+'px';box.style.top=(r.bottom+2)+'px';box.style.display='block';
  box.innerHTML=mentionMatches.map((u,i)=>`<div class="${i===mentionIdx?'active':''}" onmousedown="event.preventDefault();pickMention(${i},'${escQ(id)}')">@${esc(u.username)} <span style="color:var(--muted)">${esc(u.name||'')}</span></div>`).join('');
}
function hideMentionBox(){const box=el('mention-box');if(box)box.style.display='none';mentionOpen=false;}
function mentionKey(e,id){
  if(!mentionOpen)return;
  if(e.key==='ArrowDown'){e.preventDefault();mentionIdx=(mentionIdx+1)%mentionMatches.length;showMentionBox(el(id),id);}
  else if(e.key==='ArrowUp'){e.preventDefault();mentionIdx=(mentionIdx-1+mentionMatches.length)%mentionMatches.length;showMentionBox(el(id),id);}
  else if(e.key==='Enter'){e.preventDefault();pickMention(mentionIdx,id);}
  else if(e.key==='Escape'){hideMentionBox();}
}
function pickMention(i,id){
  const u=mentionMatches[i];if(!u)return;const ta=el(id);
  const before=ta.value.slice(0,mentionStart);const after=ta.value.slice(ta.selectionStart);
  ta.value=before+'@'+u.username+' '+after;
  const np=(before+'@'+u.username+' ').length;ta.setSelectionRange(np,np);
  hideMentionBox();ta.focus();
}
function renderMentions(t){return esc(t).replace(/@([\w가-힣]+)/g,'<span class="mention">@$1</span>');}

function timeToMinutes(v){const p=(v||'00:00').split(':').map(Number);return Math.max(0,Math.min(1440,(p[0]||0)*60+(p[1]||0)));}
function minutesToTime(v){v=Math.max(0,Math.min(1439,Math.round(v)));return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;}
function addMinutes(v,n){return minutesToTime(timeToMinutes(v)+n);}
function scheduleCountForDate(ds){return (calData.schedules||[]).filter(s=>ds>=s.start_date&&ds<=(s.end_date||s.start_date)).length;}
function scheduleColor(s){return /^#[0-9a-f]{6}$/i.test(s?.color||'')?s.color:'#2d7dd2';}
function hexToRgba(hex,alpha){const n=parseInt(scheduleColor({color:hex}).slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${alpha})`;}
function updateCurrentTimeLine(scrollToNow){
  const line=el('current-time-line'),timeline=el('day-timeline');
  if(!line||calDay!==todayStr()){if(line)line.classList.add('hide');return;}

function layoutDayEvents(schedules){
  const items=schedules.map(schedule=>{
    const start=timeToMinutes(schedule.start_time),end=Math.max(start+15,timeToMinutes(schedule.end_time||addMinutes(schedule.start_time,60)));
    return {schedule,start,end,column:0,columns:1};
  }).sort((a,b)=>a.start-b.start||a.end-b.end);
  let group=[];
  const finishGroup=()=>{
    if(!group.length)return;
    const columnEnds=[];
    group.forEach(item=>{
      let column=columnEnds.findIndex(end=>end<=item.start);
      if(column<0)column=columnEnds.length;

    });

  items.forEach(item=>{if(group.length&&item.start>=Math.max(...group.map(x=>x.end)))finishGroup();group.push(item);});
  finishGroup();return items;
}
function bindTimelineDrag(){
  const grid=el('timeline-grid'),layer=el('timeline-events-layer'),selection=el('time-selection');

  grid.onpointerdown=e=>{

    if(e.pointerType==='touch'){touchStart={x:e.clientX,y:e.clientY,min:minuteAt(e)};return;}

  grid.onpointermove=e=>{if(!active||e.pointerType==='touch')return;const next=minuteAt(e);if(next!==current)moved=true;current=next;paint();};

  };
}
const TODO_EDITOR_HOUR='(?:[01]?\\d|2[0-3]|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열두|열한|열)';
const TODO_EDITOR_CLOCK=`(?:(?:(?:오전|오후)\\s*)?(?:[01]?\\d|2[0-3]):[0-5]\\d|(?:(?:오전|오후)\\s*)?${TODO_EDITOR_HOUR}\\s*시(?:\\s*[0-5]?\\d\\s*분)?)`;
function todoTimeToken(text){
  const range=text.match(new RegExp(`^\\s*${TODO_EDITOR_CLOCK}\\s*(?:부터|[~～-])\\s*${TODO_EDITOR_CLOCK}\\s*(?:까지)?(?=\\s|$)`));
  if(range)return {raw:range[0],value:range[0].trim()};
  const deadline=text.match(new RegExp(`^\\s*${TODO_EDITOR_CLOCK}\\s*까지(?=\\s|$)`));

function slotPickerHtml(id,value,label){
  const parts=(value||'09:00').split(':'),hour=String(Number(parts[0])||0).padStart(2,'0'),minute=String(Number(parts[1])||0).padStart(2,'0');
  return `<div class="slot-picker" data-picker="${id}">
    <div class="slot-picker-title">${label}</div><input type="hidden" id="${id}" value="${hour}:${minute}">
    <div class="slot-picker-controls">
      <div class="slot-col" data-part="hour"><button type="button" onclick="slotStep('${id}','hour',-1)">▲</button><div class="slot-value" tabindex="0" onclick="slotDirect('${id}','hour')" onkeydown="slotKey(event,'${id}','hour')">${hour}</div><button type="button" onclick="slotStep('${id}','hour',1)">▼</button></div>
      <div class="slot-sep">:</div>
      <div class="slot-col" data-part="minute"><button type="button" onclick="slotStep('${id}','minute',-1)">▲</button><div class="slot-value" tabindex="0" onclick="slotDirect('${id}','minute')" onkeydown="slotKey(event,'${id}','minute')">${minute}</div><button type="button" onclick="slotStep('${id}','minute',1)">▼</button></div>
    </div><div class="slot-hint">휠, 화살표 또는 숫자 클릭으로 수정</div>
  </div>`;
}
function refreshSlotPicker(id){
  const input=el(id),picker=document.querySelector(`[data-picker="${id}"]`),parts=input.value.split(':');
  picker.querySelector('[data-part="hour"] .slot-value').textContent=parts[0];
  picker.querySelector('[data-part="minute"] .slot-value').textContent=parts[1];
}
function slotStep(id,part,delta){
  const input=el(id),parts=input.value.split(':').map(Number);
  if(part==='hour')parts[0]=(parts[0]+delta+24)%24;else parts[1]=(parts[1]+delta+60)%60;
  input.value=`${String(parts[0]).padStart(2,'0')}:${String(parts[1]).padStart(2,'0')}`;refreshSlotPicker(id);
}
function slotDirect(id,part){
  const current=el(id).value.split(':')[part==='hour'?0:1],max=part==='hour'?23:59;
  const entered=prompt(`${part==='hour'?'시':'분'}을 숫자로 입력하세요 (0~${max})`,current);
  if(entered===null||entered.trim()===''||!Number.isInteger(Number(entered))||Number(entered)<0||Number(entered)>max)return;
  const parts=el(id).value.split(':');parts[part==='hour'?0:1]=String(Number(entered)).padStart(2,'0');el(id).value=parts.join(':');refreshSlotPicker(id);
}
function slotKey(e,id,part){if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();slotStep(id,part,e.key==='ArrowUp'?-1:1);}else if(e.key==='Enter'||e.key===' '){e.preventDefault();slotDirect(id,part);}}
function bindSlotWheels(){
  document.querySelectorAll('.slot-picker .slot-col').forEach(col=>col.addEventListener('wheel',e=>{e.preventDefault();const picker=col.closest('.slot-picker');slotStep(picker.dataset.picker,col.dataset.part,e.deltaY>0?1:-1);},{passive:false}));
}
function scheduleColorPickerHtml(value){
  const color=scheduleColor({color:value}),colors=['#2d7dd2','#16a085','#27ae60','#f39c12','#e67e22','#e74c3c','#8e44ad','#34495e'];
  return `<label class="fld">일정 색상<div class="schedule-color-row"><input type="color" id="sc-color" value="${color}" oninput="syncScheduleColor(this.value)"><div class="color-swatches">${colors.map(c=>`<button type="button" class="color-swatch ${c===color?'on':''}" style="background:${c}" title="${c}" onclick="setScheduleColor('${c}')"></button>`).join('')}</div></div></label>`;

async function memoDrop(e,targetId){

function stmtRowCalc(t){
  let q=0,p=0,sg=1;
  if(t.type==='반품'){q=+t.return_qty||0;p=+t.return_price||0;sg=-1;}
  else if(+t.sell_qty){q=+t.sell_qty;p=+t.sell_price||0;}
  else if(+t.buy_qty){q=+t.buy_qty;p=+t.buy_price||0;}
  else{q=+t.return_qty||0;p=+t.return_price||0;}
  return{qty:sg*q,price:p,supply:Math.round(sg*q*p)};
}
async function stmtLoadRows(){ // 거래처·구분·기간으로 서버에서 전부 조회(1000건 제한 없음)

  const items=sel.map(t=>{const k=stmtRowCalc(t);return{date:t.date||'',name:(t.item_name||'')+(t.spec?' '+t.spec:''),qty:k.qty,price:k.price,supply:k.supply,tax:vat==='sep'?Math.round(k.supply*0.1):0,note:t.note||''};});
  const grand=items.reduce((a,x)=>a+x.supply+x.tax,0);
